# .github/workflows/ci.yml
# GitHub Actions CI Pipeline — Farmer Crop Price Predictor
# Triggers: on push or PR to main/develop branches
# Steps: Lint → Python ML Train → Jest Tests → Docker Build

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Job 1: Backend Tests ─────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests (Node.js)
    runs-on: ubuntu-latest

    services:
      # Spin up MongoDB for tests
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Python ML dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: 🤖 Train ML model
        working-directory: ./backend
        run: python model/train.py

      - name: 🧪 Run Jest tests
        working-directory: ./backend
        env:
          TEST_MONGO_URI: mongodb://localhost:27017/crop_predictor_test
          NODE_ENV: test
        run: npm test

  # ── Job 2: Python ML Validation ──────────────────────────────────────────────
  ml-validate:
    name: 🤖 ML Model Validation (Python)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: 🏋️ Train and validate ML model
        working-directory: ./backend
        run: python model/train.py

      - name: ✅ Verify model.pkl exists
        run: test -f backend/model/model.pkl && echo "✅ model.pkl created" || exit 1

  # ── Job 3: Docker Build ───────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, ml-validate]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: crop-predictor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: crop-predictor-frontend:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=http://localhost:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Docker build summary
        run: |
          echo "✅ Backend image built: crop-predictor-backend:${{ github.sha }}"
          echo "✅ Frontend image built: crop-predictor-frontend:${{ github.sha }}"

  # ── Job 4: Frontend Lint & Build ─────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build (React)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build React app
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: http://localhost:5000
          CI: false
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: frontend/build/
          retention-days: 7
